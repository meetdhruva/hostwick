[workspace]
resolver = "3"
members = [
    "crates/hostwick-core",
    "crates/hostwick-ssh",
    "crates/hostwick-sftp",
    "crates/hostwick-transfer",
    "crates/hostwick-vault",
    "crates/hostwick-store",
    "crates/hostwick-import",
    "apps/cli",
    "apps/desktop",
]
# The desktop app pulls in the GPU UI stack (and on Linux, X11/Wayland/Vulkan
# dev packages), so a plain `cargo build` / `cargo test` covers everything else.
default-members = [
    "crates/hostwick-core",
    "crates/hostwick-ssh",
    "crates/hostwick-sftp",
    "crates/hostwick-transfer",
    "crates/hostwick-vault",
    "crates/hostwick-store",
    "crates/hostwick-import",
    "apps/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/your-org/hostwick"
authors = ["Hostwick contributors"]

[workspace.dependencies]
hostwick-core = { path = "crates/hostwick-core", version = "0.2.0" }
hostwick-ssh = { path = "crates/hostwick-ssh", version = "0.2.0" }
hostwick-sftp = { path = "crates/hostwick-sftp", version = "0.2.0" }
hostwick-transfer = { path = "crates/hostwick-transfer", version = "0.2.0" }
hostwick-vault = { path = "crates/hostwick-vault", version = "0.2.0" }
hostwick-store = { path = "crates/hostwick-store", version = "0.2.0" }
hostwick-import = { path = "crates/hostwick-import", version = "0.2.0" }

# `ring` instead of the default aws-lc-rs: no CMake/NASM needed on Windows.
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "3.0"
# Same version russh pins; adds PuTTY .ppk (v2/v3) parsing.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ppk"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
dirs = "6"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
blake3 = "1"
hex = "0.4"
tempfile = "3"

[workspace.lints.rust]
# `deny` (not `forbid`) so the one Windows console call in the CLI can opt out
# locally with a SAFETY comment.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"
large_futures = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
# Keep unwinding: a panic in one session task becomes a JoinError instead of
# taking down every open tab.
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"

[profile.dev.package."*"]
opt-level = 2
