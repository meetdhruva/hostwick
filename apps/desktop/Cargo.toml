[package]
name = "hostwick-desktop"
description = "Hostwick desktop app: terminals, file manager and tunnels in one native GPU UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "hostwick-desktop"
path = "src/main.rs"

[dependencies]
# One dependency that pins the matching GPUI snapshot plus gpui-base,
# gpui-component and the Lucide icon assets. Pinned exactly: GPUI is 0.x and
# breaks APIs between releases, so upgrades are deliberate.
gpui-kit = "=0.8.1"
alacritty_terminal = "=0.26.0"
hostwick-core.workspace = true
hostwick-ssh.workspace = true
hostwick-sftp.workspace = true
hostwick-transfer.workspace = true
hostwick-store.workspace = true
hostwick-vault.workspace = true
hostwick-import.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
