# cargo-deny: run `cargo deny check` in CI.
[advisories]
version = 2
yanked = "deny"
# Flag unmaintained crates we depend on directly. Transitive ones (mostly in
# the GPU UI stack: instant, paste, rustybuzz, ttf-parser, zbus/zvariant, ...)
# are tracked upstream and reviewed when bumping gpui-kit.
unmaintained = "workspace"
ignore = [
    # rsa "Marvin" timing side channel: no fixed `rsa` release exists yet. It
    # needs many precise timing measurements of private-key operations; here
    # RSA keys only sign SSH auth challenges on the user's own machine. Drop
    # this once russh/ssh-key move to a fixed rsa release.
    { id = "RUSTSEC-2023-0071", reason = "no fix available; local-only signing; see comment" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "0BSD",
    "OFL-1.1", "Ubuntu-font-1.0", "CDLA-Permissive-2.0", "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
