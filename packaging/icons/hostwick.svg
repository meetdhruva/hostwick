<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A44"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="0.55" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FFE7A3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS-style squircle with margin so it sits well in docks and taskbars -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#3B4E7A" stroke-opacity="0.6" stroke-width="6"/>
  <!-- prompt chevron -->
  <path d="M262 352 L452 512 L262 672" fill="none" stroke="#7FD6FF" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wick (the cursor) -->
  <rect x="540" y="636" width="236" height="72" rx="36" fill="#E8EEF8"/>
  <!-- flame on the wick -->
  <circle cx="658" cy="472" r="170" fill="url(#glow)"/>
  <path d="M658 312 C 600 400, 572 450, 590 520 C 604 576, 640 600, 658 600 C 676 600, 712 576, 726 520 C 744 450, 716 400, 658 312 Z" fill="url(#flame)"/>
  <path d="M658 440 C 634 480, 626 512, 636 544 C 642 566, 652 574, 658 574 C 664 574, 674 566, 680 544 C 690 512, 682 480, 658 440 Z" fill="#FFF6D8"/>
</svg>
