[package]
name = "hostwick-keys"
description = "SSH key generation and conversion for Hostwick: OpenSSH and PuTTY .ppk (v2/v3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ssh-key = { workspace = true, features = [
    "ppk",
    "ed25519",
    "p256",
    "p384",
    "p521",
    "rsa",
    "encryption",
    "rand_core",
] }
# Legacy PEM keys (`BEGIN RSA PRIVATE KEY`, PKCS#8) for import only.
russh.workspace = true
getrandom = { version = "0.4", features = ["sys_rng"] }
argon2.workspace = true
hmac = "0.13"
sha1 = { version = "0.11", default-features = false }
base64.workspace = true
hex.workspace = true
secrecy.workspace = true
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
